name: Build Signed APK (dev_13_2)

on:
  push:
    branches:
      - dev_13_2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev_13_2

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Create Google Services JSON File
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          else
            echo '{"project_info":{"project_number":"0","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:0:android:0","android_client_info":{"package_name":"com.msp1974.vacompanion"}}],"api_key":[{"current_key":""}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Decode signing keystore
        run: echo "${{ secrets.VACA_KEYSTORE }}" | base64 -d > app/vaca.keystore

      - name: Build signed debug APK
        env:
          VACA_KEYSTORE: vaca.keystore
          KEYSTORE_FILE: ${{ github.workspace }}/app/vaca.keystore
          VACA_STORE_PASSWORD: ${{ secrets.VACA_STORE_PASSWORD }}
          VACA_KEY_ALIAS: ${{ secrets.VACA_KEY_ALIAS }}
          VACA_KEY_PASSWORD: ${{ secrets.VACA_KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.VACA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VACA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VACA_KEY_PASSWORD }}
        run: ./gradlew assembleDebug -x lint

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaca-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
