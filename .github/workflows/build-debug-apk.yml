name: Build Debug APK

on:
  push:
    branches:
      - feature/*
      - more-commands*
      - dev_13_0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Decode signing keystore
        run: echo "${{ secrets.VACA_KEYSTORE }}" | base64 -d > app/vaca.keystore

      - name: Create dummy google-services.json
        run: |
          mkdir -p app
          echo '{"project_info":{"project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:0:android:0"}}],"configuration_version":"1"}' > app/google-services.json

      - name: Build signed debug APK
        env:
          VACA_KEYSTORE: app/vaca.keystore
          VACA_STORE_PASSWORD: ${{ secrets.VACA_STORE_PASSWORD }}
          VACA_KEY_ALIAS: ${{ secrets.VACA_KEY_ALIAS }}
          VACA_KEY_PASSWORD: ${{ secrets.VACA_KEY_PASSWORD }}
        run: ./gradlew assembleDebug -x lint

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaca-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
